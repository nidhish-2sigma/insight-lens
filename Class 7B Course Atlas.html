<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Class 7B Course Atlas</title>
<meta name="description" content="Interactive design mock of a course atlas for teachers: a Today feed, student profiles and eleven views of one class across its textbooks, shown with invented sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: cohort strip across the top is the shared student selector; a sticky question rail on the left, grouped into students, content, and act-and-check; one view at a time on the right, answer first, then chart, drill-down, takeaways and data needs */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --surface-2:#eef1f3; --band:#f3f5f7;
  --ink:#15191d; --ink-2:#4a535b; --ink-3:#737c84; --rule:#dbe1e6;
  --accent:#5b4bc4; --accent-ink:#ffffff; --accent-soft:#ece9fb;
  --good:#2a78d6; --good-ink:#1c5cab; --bg-good:#e6f0fc;
  --bad:#e34948; --bad-ink:#b3261e; --bg-bad:#fdeceb;
  --watch:#eda100; --watch-ink:#865600; --bg-watch:#fdf2d8;
  --neutral:#b9b7ae; --neutral-ink:#5f5e5a;
  --gone:#4f9a3c; --gone-ink:#2e6a22; --bg-gone:#e8f3e3;
  --m-mas:#1c5cab; --m-dev:#86b6ef; --on-mas:#eaf2fd;
  --hatch:#c3cad0;
  --c0:#f4f1ee; --c1:#fbdccf; --c2:#f6ad93; --c3:#e5704f; --c4:#b5432a;
  --hd-ny:#b5432a; --hd-dv:#ea8564;
  --st-gu:#e34948; --st-sk:#eda100; --st-rt:#7aaeee;
  --ct0:#15191d; --ct1:#15191d; --ct2:#15191d; --ct3:#ffffff; --ct4:#ffffff;
  --f1:#86b6ef; --f2:#5598e7; --f3:#2a78d6; --f4:#1c5cab; --f5:#104281;
  --ft1:#0b1a2e; --ft2:#0b1a2e; --ft3:#ffffff; --ft4:#ffffff; --ft5:#ffffff;
  --tip-bg:#15191d; --tip-ink:#ffffff; --tip-ink-2:#c3cad0; --shadow:rgba(20,25,30,.16);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1214; --surface:#171b1e; --surface-2:#20262a; --band:#1b2024;
    --ink:#eef1f3; --ink-2:#b4bcc3; --ink-3:#8b949b; --rule:#2b3237;
    --accent:#9b90ee; --accent-ink:#0f1214; --accent-soft:#2a2652;
    --good:#3987e5; --good-ink:#8dbaf0; --bg-good:#14273e;
    --bad:#e66767; --bad-ink:#f39b9b; --bg-bad:#3a1c1c;
    --watch:#c98500; --watch-ink:#f0c060; --bg-watch:#382b10;
    --neutral:#605f5a; --neutral-ink:#b9b7ae;
    --gone:#5aa84a; --gone-ink:#9bd68c; --bg-gone:#18301a;
    --m-mas:#5598e7; --m-dev:#1f548f; --on-mas:#0b1a2e;
    --hatch:#3d464c;
    --c0:#22282c; --c1:#4a2b24; --c2:#7d3b2a; --c3:#c0573a; --c4:#ec8a6c;
    --hd-ny:#ec8a6c; --hd-dv:#a84a31;
    --st-gu:#d14646; --st-sk:#c98500; --st-rt:#2c6db8;
    --ct0:#eef1f3; --ct1:#eef1f3; --ct2:#eef1f3; --ct3:#ffffff; --ct4:#15191d;
    --f1:#184f95; --f2:#256abf; --f3:#3987e5; --f4:#6da7ec; --f5:#9ec5f4;
    --ft1:#eef1f3; --ft2:#eef1f3; --ft3:#0f1214; --ft4:#0f1214; --ft5:#0f1214;
    --tip-bg:#eef1f3; --tip-ink:#15191d; --tip-ink-2:#4a535b; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#171b1e; --surface-2:#20262a; --band:#1b2024;
  --ink:#eef1f3; --ink-2:#b4bcc3; --ink-3:#8b949b; --rule:#2b3237;
  --accent:#9b90ee; --accent-ink:#0f1214; --accent-soft:#2a2652;
  --good:#3987e5; --good-ink:#8dbaf0; --bg-good:#14273e;
  --bad:#e66767; --bad-ink:#f39b9b; --bg-bad:#3a1c1c;
  --watch:#c98500; --watch-ink:#f0c060; --bg-watch:#382b10;
  --neutral:#605f5a; --neutral-ink:#b9b7ae;
  --gone:#5aa84a; --gone-ink:#9bd68c; --bg-gone:#18301a;
  --m-mas:#5598e7; --m-dev:#1f548f; --on-mas:#0b1a2e;
  --hatch:#3d464c;
  --c0:#22282c; --c1:#4a2b24; --c2:#7d3b2a; --c3:#c0573a; --c4:#ec8a6c;
  --hd-ny:#ec8a6c; --hd-dv:#a84a31;
  --st-gu:#d14646; --st-sk:#c98500; --st-rt:#2c6db8;
  --ct0:#eef1f3; --ct1:#eef1f3; --ct2:#eef1f3; --ct3:#ffffff; --ct4:#15191d;
  --f1:#184f95; --f2:#256abf; --f3:#3987e5; --f4:#6da7ec; --f5:#9ec5f4;
  --ft1:#eef1f3; --ft2:#eef1f3; --ft3:#0f1214; --ft4:#0f1214; --ft5:#0f1214;
  --tip-bg:#eef1f3; --tip-ink:#15191d; --tip-ink-2:#4a535b; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
.eyebrow{font-family:var(--font-mono);font-weight:500;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0}
h1,h2,h3,h4{margin:0;text-wrap:balance}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 40px;padding-block:6px 18px;border-bottom:1px solid var(--rule)}
.title{min-width:0;max-width:640px}
.top h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.05;letter-spacing:-.015em;margin:6px 0 8px}
.sub{margin:0;color:var(--ink-2);max-width:62ch}
.ruler{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;width:min(100%,560px)}
.ruler span{display:grid;gap:1px;padding:5px 7px 4px;background:var(--surface);border-top:3px solid var(--ink-3);font-size:12px;min-width:0}
.ruler span.now{border-top-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ruler span.next{border-top-style:dashed;border-top-color:var(--neutral);color:var(--ink-3)}
.ruler b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruler em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.ruler span.now em{color:var(--accent)}

/* cohort strip */
.cohort{margin-top:18px;display:grid;gap:10px}
.cohort-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px}
.cohort-head .right{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.hint{margin:0;font-size:13px;color:var(--ink-3)}
.logchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 5px 3px 12px;cursor:pointer}
.logchip:hover{border-color:var(--ink-3)}
.logchip b{font-family:var(--font-mono);font-weight:500;font-size:11.5px;background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:1px 7px;min-width:22px;text-align:center}
.logchip.has b{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cnt{font-family:var(--font-mono);font-weight:500;font-size:10.5px;line-height:16px;min-width:18px;text-align:center;border-radius:999px;padding:0 5px;background:var(--bg-bad);color:var(--bad-ink)}
.chip[aria-pressed="true"] .cnt{background:var(--accent-ink);color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.thread{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px}
.th-who{display:grid;gap:0;min-width:130px}
.th-who b{font-family:var(--font-display);font-size:20px;line-height:1.1}
.th-who span{font-size:12.5px;color:var(--ink-2)}
.th-flags{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.flag{display:inline-flex;align-items:center;gap:7px;font-size:13px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:3px 9px;cursor:pointer;text-align:left}
.flag:hover{border-color:var(--ink-3)}
.vn{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.lvl{flex:none;width:9px;height:9px;border-radius:2px;background:var(--neutral)}
.lvl.bad{background:var(--bad)} .lvl.watch{background:var(--watch)} .lvl.good{background:var(--good)}

/* main layout */
.main{display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:1px;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.rg{font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:14px 10px 4px}
.rail button{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--ink-2)}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.rail button[aria-current="page"] .glyph{color:var(--accent)}
.glyph{color:var(--ink-3)}
.rq{font-size:14px;font-weight:700;line-height:1.25}
.rn{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--ink-3);margin-right:5px}
.rk{font-size:12px;color:var(--ink-3);line-height:1.3}
.view{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px 24px;min-width:0}
.view:focus{outline:none}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 16px}
.q{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--ink-2);margin:6px 0 4px}
details.how{font-size:13.5px;color:var(--ink-2);max-width:60ch}
details.how summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--ink-3);list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary:hover{color:var(--ink)}
details.how[open]{background:var(--surface-2);border-radius:8px;padding:8px 11px}
details.how p{margin:6px 0 0}
.dnext{font-size:14px;color:var(--ink-2)}
.answer{font-family:var(--font-display);font-weight:500;font-size:clamp(20px,2.2vw,25px);line-height:1.25;letter-spacing:-.005em;margin:0 0 16px;max-width:46ch;text-wrap:balance}
.how{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-size:14px;color:var(--ink-2);margin:0 0 14px;max-width:86ch}
.kind{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:0 0 12px}
.tog,.seg button{display:inline-flex;align-items:center;gap:7px;font-size:13px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer}
.tog i{width:10px;height:10px;border-radius:2px}
.tog[aria-pressed="false"]{color:var(--ink-3);background:var(--surface-2)}
.tog[aria-pressed="false"] i{opacity:.25}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.rng{display:grid;grid-template-columns:auto auto;align-items:center;gap:2px 10px;font-size:13px;color:var(--ink-2)}
.rng output{font-family:var(--font-mono);font-size:12px;color:var(--ink);text-align:right}
.rng input{grid-column:1 / -1;width:190px;accent-color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.chk input{accent-color:var(--accent)}
.sel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.sel select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.fig{overflow-x:auto;margin-inline:-4px;padding-inline:4px}

/* charts */
.viz{display:block;width:100%;height:auto;min-width:640px;max-width:940px}
.viz.board{max-width:760px}
.viz text{font-family:var(--font-body);font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.viz .t1{fill:var(--ink)} .viz .t2{fill:var(--ink-2)} .viz .t3{fill:var(--ink-3)}
.viz .tbad{fill:var(--bad-ink)} .viz .tgood{fill:var(--good-ink)} .viz .twatch{fill:var(--watch-ink)} .viz .tgone{fill:var(--gone-ink)} .viz .tacc{fill:var(--accent)}
.viz .tin{fill:var(--on-mas);font-weight:700;pointer-events:none}
.viz .ct0{fill:var(--ct0)} .viz .ct1{fill:var(--ct1)} .viz .ct2{fill:var(--ct2)} .viz .ct3{fill:var(--ct3)} .viz .ct4{fill:var(--ct4)}
.viz .grid{stroke:var(--rule);stroke-width:1}
.viz .axis{stroke:var(--ink-3);stroke-width:1.2}
.viz .row,.viz .hit{cursor:pointer;outline:none}
.viz .rbg{fill:transparent}
.viz .row:hover .rbg{fill:var(--surface-2)}
.viz .row.on .rbg{fill:var(--accent-soft)}
.viz .row:focus-visible .rbg,.viz .hit:focus-visible>rect:first-child{stroke:var(--accent);stroke-width:2}
.viz .dim{opacity:.28}
.viz .nbg{pointer-events:none}
.viz .cell{cursor:pointer;outline:none}
.viz .cell:hover>rect:first-child{stroke:var(--ink);stroke-width:1.5}
.viz .cell:focus-visible>rect:first-child{stroke:var(--accent);stroke-width:2.5}
.viz .ln{cursor:pointer}
.viz .ln:hover .vis{stroke-width:3.5}
.viz .ln:focus-visible .vis{stroke:var(--accent)}
.spark{display:block;max-width:100%;height:auto}
.spark text{font-family:var(--font-body);font-size:11px;fill:var(--ink-3)}
.togs{display:inline-flex;flex-wrap:wrap;gap:4px}

/* detail, takeaways, data */
.detail{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);display:grid;gap:14px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.detail h3{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.2}
.dsub{margin:-8px 0 0;font-size:13.5px;color:var(--ink-3)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.dgrid > *{min-width:0}
.dl{display:flex;align-items:center;gap:7px;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.names{display:flex;flex-wrap:wrap;gap:4px}
.nm{font-size:12.5px;border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:1px 7px;cursor:pointer}
.nm:hover{border-color:var(--ink-3)}
.nm.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.none{margin:0;font-size:13px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:8px 11px;min-width:0}
.stat .l{display:block;font-size:12px;color:var(--ink-3)}
.stat .v{display:block;font-size:14.5px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.bad{background:var(--bg-bad);color:var(--bad-ink)} .pill.good{background:var(--bg-good);color:var(--good-ink)}
.pill.watch{background:var(--bg-watch);color:var(--watch-ink)} .pill.gone{background:var(--bg-gone);color:var(--gone-ink)}
.item{border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;font-size:14px}
.item p{margin:0}
.callout{background:var(--surface-2);border-radius:8px;padding:10px 13px;font-size:14px;max-width:80ch;display:grid;gap:8px;justify-items:start}
.callout .dl{margin:0}
.callout p{margin:0}
.dtext{margin:0;font-size:14px;color:var(--ink-2);max-width:80ch}
.lnks{display:flex;flex-wrap:wrap;gap:6px 14px}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13.5px;text-align:left}
.lnk:hover{text-decoration:underline}
.takes{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.takes li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:14px;max-width:86ch}
.nb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:11px;font-weight:700;margin-top:1px;flex:none}
details.data{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule)}
details.data summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-2)}
details.data ul{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2);display:grid;gap:3px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.btn{font-size:14px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 13px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.small{font-size:13px;padding:4px 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.done{color:var(--good-ink);border-color:var(--good);background:var(--bg-good)}
.btn.ghost{background:transparent}
.ic{width:12px;height:12px;flex:none;vertical-align:-1px}
.ic.up{color:var(--good-ink)} .ic.down{color:var(--bad-ink)} .ic.sad{color:var(--watch-ink)}

/* view 1: live board */
.bnr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border-radius:10px;padding:11px 14px;margin:0 0 14px;border:1px solid var(--rule);background:var(--surface-2)}
.bnr.bad{background:var(--bg-bad);border-color:var(--bad)}
.bnr.good{background:var(--bg-good);border-color:var(--good)}
.bnr > div{display:grid;gap:2px;max-width:72ch}
.bnr p{margin:0;font-size:14px}
.bnr .dl{margin:0}
.bnr .acts{display:flex;flex-wrap:wrap;gap:6px}
.queue{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.qi{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:start;border:1px solid var(--rule);border-left:4px solid var(--neutral);border-radius:8px;padding:9px 11px;background:var(--surface)}
.qi.bad{border-left-color:var(--bad)} .qi.watch{border-left-color:var(--watch)}
.qi .qn{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.qi p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.qi .qh{font-size:14px}
.qi .qh .nm{font-weight:700;font-size:13.5px}

/* view 2: effort and mastery */
.lgrid{display:inline-grid;grid-template-columns:auto repeat(4,auto);gap:3px 14px;align-items:center;justify-items:center;font-size:12px;color:var(--ink-2);margin:0 0 10px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px}
.lgrid .lh{font-size:11.5px;color:var(--ink-3)}
.lgrid .lr{justify-self:end;font-weight:700}
.lgrid svg{display:block}
.ags{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.ag{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;display:grid;gap:8px;align-content:start}
.ag .dl{margin:0}

/* view 3: watchlist */
.wl{display:grid;gap:8px}
.wl-h,.wl-r{display:grid;grid-template-columns:140px 290px minmax(0,1fr);gap:8px 16px;align-items:center}
.wl-h{font-size:12px;color:var(--ink-3);padding:0 13px}
.wl-r{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--surface)}
.wl-r.on{border-color:var(--accent);background:var(--accent-soft)}
.wl-r.watch{border-style:dashed}
.wl-who{display:grid;gap:5px;justify-items:start}
.nmx{font-family:var(--font-display);font-weight:700;font-size:17px;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:inherit}
.nmx:hover{text-decoration:underline}
.wl-sig{display:grid;gap:7px;min-width:0}
.sigs{display:flex;flex-wrap:wrap;gap:4px}
.sg{font-size:12px;border-radius:4px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2)}
.sg.bad{background:var(--bg-bad);color:var(--bad-ink)}
.pat{margin:0;font-size:13.5px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.draft{grid-column:1 / -1;display:grid;gap:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.draft label{font-size:13px;font-weight:700;color:var(--ink-2)}
.draft textarea{width:100%;min-height:104px;font-size:14px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);resize:vertical}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.mini{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:5px 8px;background:var(--surface);cursor:pointer;text-align:left;font-size:13px}
.mini:hover{border-color:var(--ink-3)}
.mini.on{border-color:var(--accent);background:var(--accent-soft)}

/* view 5: funnel */
.fn-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.fn{display:grid;gap:2px;min-width:0}
.fn-row{display:grid;grid-template-columns:146px minmax(0,1fr) 112px;align-items:center;gap:12px;padding:2px 0}
.fn-lab{font-size:14px;font-weight:700;text-align:right;line-height:1.25}
.fn-track{display:flex;justify-content:center;min-width:0}
.fn-bar{height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;min-width:36px;transition:width .25s ease}
.fn-d{font-size:12.5px;display:inline-flex;align-items:center;gap:4px;color:var(--ink-3)}
.fn-d.up{color:var(--good-ink)} .fn-d.down{color:var(--bad-ink)}
.fn-leak{margin:4px 0 6px 158px;border-left:3px solid var(--bad);background:var(--bg-bad);border-radius:0 8px 8px 0;padding:8px 12px;display:grid;gap:7px}
.fl-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:14px;color:var(--bad-ink)}
.fl-h b{font-size:17px;font-family:var(--font-display)}
.fl-names{display:flex;flex-wrap:wrap;gap:5px}
.who5{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:2px 7px 2px 2px;font-size:12.5px}
.who5 .nm{border:0;padding:1px 5px}
.who5 .why{color:var(--ink-3)}
.fl-act{margin:0;font-size:13.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fn-end{margin:6px 0 0 158px;border-left:3px solid var(--good);background:var(--bg-good);border-radius:0 8px 8px 0;padding:8px 12px;display:grid;gap:7px}
.fn-end .fl-h{color:var(--good-ink)}
.rules{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:grid;gap:12px;background:var(--surface-2)}
.rules h3{font-size:15px;font-family:var(--font-body);font-weight:700}
.rules .rng{grid-template-columns:minmax(0,1fr) auto}
.rules .rng input{width:100%}
.rules.off{opacity:.55}
.rules p{margin:0;font-size:13px;color:var(--ink-2)}

/* view 6: course map */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;margin:0 0 8px;color:var(--ink-2)}

/* view 9: items */
.blist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--rule);border-left:4px solid var(--bad);border-radius:8px;padding:9px 12px;background:var(--surface)}
.bi.fixed{border-left-color:var(--good)}
.bi p{margin:0;font-size:13.5px;color:var(--ink-2)}
.bi .nmx{font-size:15px}
.opts{display:grid;gap:6px;max-width:560px}
.opt{display:grid;grid-template-columns:64px minmax(0,1fr) 92px;gap:4px 10px;align-items:center;font-size:13px}
.opt b{font-weight:700}
.ob{display:grid;gap:2px}
.ob span{display:block;height:8px;border-radius:2px;min-width:2px}

/* view 11: plan */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pcard{border:1px solid var(--rule);border-top:4px solid var(--neutral);border-radius:10px;padding:11px 13px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.pcard.bad{border-top-color:var(--bad)} .pcard.watch{border-top-color:var(--watch)} .pcard.good{border-top-color:var(--good)}
.pcard h4{font-size:15px;display:flex;align-items:center;gap:8px}
.pcard p{margin:0;font-size:13px;color:var(--ink-2)}
.pg{display:grid;gap:5px}
.chipx{display:inline-flex;align-items:center;font-size:12.5px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);overflow:hidden}
.chipx .nm{border:0;border-radius:0}
.chipx .x{border:0;border-left:1px solid var(--rule);background:none;padding:1px 6px;cursor:pointer;color:var(--ink-3);display:inline-flex;align-items:center}
.chipx .x:hover{color:var(--bad-ink);background:var(--bg-bad)}
.gn{font-family:var(--font-mono);font-size:10.5px;margin-left:5px;color:var(--watch-ink)}
.planbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:4px}

/* view 12 and overview */
.prog{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prog li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;font-size:13.5px}
.ov h2.sec{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 4px}
.ov section + section{margin-top:28px}
.ov .lead{margin:0 0 12px;color:var(--ink-2);max-width:74ch}
.ov-intro{font-family:var(--font-display);font-weight:500;font-size:clamp(20px,2.2vw,25px);line-height:1.25;margin:6px 0 10px;max-width:48ch}
.how-list{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-2)}
.how-list li{display:flex;gap:7px;align-items:baseline}
.how-list b{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 10px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--surface)}
.srow.on{border-color:var(--accent);background:var(--accent-soft)}
.srow .nmx{font-size:15px}
.vchips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
.vchip{font-family:var(--font-mono);font-size:11px;font-weight:500;min-width:22px;height:22px;border-radius:5px;border:0;cursor:pointer;background:var(--bg-watch);color:var(--watch-ink)}
.vchip.bad{background:var(--bg-bad);color:var(--bad-ink)}
.vchip:hover{outline:1.5px solid currentColor}
.scard{display:grid;gap:8px;align-content:start;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--surface);min-width:0}
.scard.on{border-color:var(--accent);background:var(--accent-soft)}
.sc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc-h b{font-family:var(--font-display);font-size:18px}
.sc-h span{font-size:12.5px;color:var(--bad-ink);font-weight:700;white-space:nowrap}
.sc-f{display:grid;gap:4px}
.sc-f .flag{width:100%}
.vgroup{margin:14px 0 6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.vcard{display:grid;gap:6px;align-content:start;text-align:left;border:1px solid var(--rule);border-radius:10px;padding:13px 14px;background:var(--surface);cursor:pointer;min-width:0}
.vcard:hover{border-color:var(--ink-3)}
.vc-top{display:flex;align-items:center;gap:10px;color:var(--accent)}
.vc-top b{color:var(--ink);font-size:14.5px}
.vc-q{font-weight:700;font-size:14.5px;line-height:1.3}
.vc-a{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.vc-go{font-size:13px;color:var(--accent);font-weight:700}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:grid;grid-template-columns:48px 64px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;border-bottom:1px solid var(--rule);padding:7px 2px}
.log time{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--rule)}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:700}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.vp{display:inline-block;font-family:var(--font-mono);font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;margin:0 3px 3px 0;color:var(--ink-2)}
.foot{margin:18px 0 0;font-size:12.5px;color:var(--ink-3)}

/* today feed */
.today .answer{margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;margin:0 0 12px}
.tile{display:grid;gap:1px;align-content:start;text-align:left;border:1px solid var(--rule);border-radius:10px;padding:8px 12px 10px;background:var(--surface);cursor:pointer;min-width:0;color:inherit}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tl-n{display:flex;align-items:baseline;gap:5px}
.tl-n b{font-family:var(--font-display);font-size:24px;line-height:1.15}
.tl-n small{font-size:12px;color:var(--ink-3)}
.tile.bad .tl-n b{color:var(--bad-ink)} .tile.watch .tl-n b{color:var(--watch-ink)} .tile.good .tl-n b{color:var(--good-ink)}
.tl-l{font-size:13px;font-weight:700;line-height:1.25}
.tl-d{font-size:12px;color:var(--ink-3);line-height:1.3}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:48px minmax(0,1fr);gap:0 12px;border:1px solid var(--rule);border-left:4px solid var(--neutral);border-radius:10px;padding:11px 13px 12px 8px;background:var(--surface);min-width:0}
.tcard.bad{border-left-color:var(--bad)} .tcard.watch{border-left-color:var(--watch)} .tcard.good{border-left-color:var(--good)}
.tcard.has{box-shadow:0 0 0 2px var(--accent)}
.tcard.dim{opacity:.62}
.tc-n{display:grid;align-content:start;justify-items:center;text-align:center;padding-top:1px}
.tc-n b{font-family:var(--font-display);font-size:28px;line-height:1}
.tc-n span{font-size:11px;color:var(--ink-3);margin-top:3px}
.tc-n.bad b{color:var(--bad-ink)} .tc-n.watch b{color:var(--watch-ink)} .tc-n.good b{color:var(--good-ink)}
.tc-b{min-width:0}
.tc-cat{margin:0;font-size:12px;font-weight:700}
.tc-cat.bad{color:var(--bad-ink)} .tc-cat.watch{color:var(--watch-ink)} .tc-cat.good{color:var(--good-ink)}
.tc-t{margin:2px 0 8px;font-family:var(--font-display);font-size:16px;font-weight:700;line-height:1.3}
.tc-t span{font-family:var(--font-body);font-weight:400;font-size:14px;color:var(--ink-2)}
.tc-m{margin:0;font-size:13px;color:var(--ink-2)}
.tc-also{margin:-4px 0 8px;font-size:12.5px;color:var(--ink-3)}
.tc-act{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.more{align-self:center;font-size:12.5px;color:var(--ink-3);padding:1px 4px}
.gset{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.gset li{display:grid;grid-template-columns:16px 88px minmax(0,1fr) auto 28px;gap:4px 10px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:6px 6px 6px 10px;font-size:13.5px}
.gset li.new{border-style:dashed;border-color:var(--accent)}
.gi{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.fmt{justify-self:start;font-family:var(--font-mono);font-size:11px;border-radius:4px;padding:2px 6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.fmt.new{background:var(--accent-soft);color:var(--accent)}
.gq{display:grid;min-width:0}
.gq b{font-weight:700;overflow-wrap:anywhere}
.gq span{font-size:12px;color:var(--ink-3)}
.gq code{font-family:var(--font-mono);font-size:12.5px;font-weight:500;background:var(--surface-2);border-radius:3px;padding:0 4px}
.gn2{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.x{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid transparent;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer}
.x:hover{border-color:var(--rule);color:var(--ink)}
.x.sm{width:22px;height:22px}
.lnk.mut{color:var(--ink-3);font-weight:500}
.tc-n{cursor:help;border-radius:6px}
.tc-n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tdmore{margin-top:10px}
.gfor{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px}
.gl{font-size:12px;font-weight:700;color:var(--ink-3);min-width:34px}
.who5.out .nm{text-decoration:line-through;color:var(--ink-3)}
.gwhy .dl{margin:0 0 4px}
.gwhy ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13px;color:var(--ink-2)}
.chg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cg{display:grid;gap:6px;align-content:start;justify-items:start;border:1px solid var(--rule);border-top:3px solid var(--neutral);border-radius:10px;padding:10px 12px 12px;background:var(--surface);min-width:0}
.cg.good{border-top-color:var(--good)} .cg.watch{border-top-color:var(--watch)} .cg.bad{border-top-color:var(--bad)}
.cg-h{margin:0;display:flex;align-items:baseline;gap:7px;font-weight:700;font-size:14px}
.cg-h b{font-family:var(--font-display);font-size:22px;line-height:1}
.cg.good .cg-h b{color:var(--good-ink)} .cg.watch .cg-h b{color:var(--watch-ink)} .cg.bad .cg-h b{color:var(--bad-ink)}
.cg-d{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.35}

/* student profile */
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.pname{margin:2px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3vw,34px);line-height:1.1}
.pnav{display:flex;gap:6px}
.psum{margin:10px 0 12px;font-size:17px;line-height:1.45;max-width:68ch}
.usnaps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.usnap{display:inline-flex;align-items:center;gap:7px;font-size:13px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:4px 10px;color:inherit}
button.usnap{cursor:pointer} button.usnap:hover{border-color:var(--ink-3)}
.usnap span{color:var(--ink-3)}
.usnap.next{border-style:dashed}
.sec3{font-family:var(--font-display);font-size:16px;font-weight:700;margin:16px 0 8px}
.moms{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:5px}
.moms li{display:grid;grid-template-columns:48px 12px minmax(0,1fr);gap:8px;align-items:center;font-size:13.5px}
.mw{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.mk{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.mk.iv{border-radius:1px;transform:rotate(45deg) scale(.85);background:var(--good)} .mk.mis{background:var(--watch)} .mk.good{background:var(--good)}
.viz .tmas{fill:var(--m-mas)}
.mleg{align-items:center;padding:7px 11px;border:1px solid var(--rule);border-radius:8px;width:fit-content;max-width:100%}
.mleg .lt{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.mleg .lt:not(:first-child){margin-left:6px}
/* view 1: live board */
.lstats{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:0 0 6px;font-size:13.5px;color:var(--ink-2)}
.lstats b{font-family:var(--font-display);font-size:19px;color:var(--ink);margin-right:3px}
.trackw{overflow-x:auto;margin:0 -4px 6px;padding:0 4px 4px}
.track{display:grid;grid-template-columns:repeat(10,minmax(68px,1fr));gap:4px;min-width:720px}
.lane{display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border-radius:8px;padding:6px 5px 7px;min-width:0}
.lane.hot{background:var(--bg-bad);box-shadow:inset 0 0 0 1px var(--bad)}
.lane.away{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin:0 2px 3px;font-size:11.5px;color:var(--ink-2)}
.lh b{font-weight:700;white-space:nowrap}
.lh span{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.lc{display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%;font-size:12px;text-align:left;border:0;border-left:3px solid var(--neutral);background:var(--surface);border-radius:4px;padding:2px 5px;cursor:pointer;color:var(--ink)}
.lc:hover{outline:1px solid var(--ink-3)}
.lc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--bad-ink)}
.lc.stuck{border-left-color:var(--bad);font-weight:700}
.lc.guess,.lc.idle{border-left-color:var(--watch)}
.lc.idle em{color:var(--watch-ink)}
.lc.done{border-left-color:var(--good)}
.lc.helped{border-left-color:var(--good);color:var(--ink-2)}
.lc.helped .ic{color:var(--good-ink)}
.lc.absent{border-left-color:var(--hatch);color:var(--ink-3);background:transparent}

function sel5(tb,H){const all=H.T.flatMap(U=>U.subs.flatMap(J=>J.ks.map(K=>K.k)));let k=S.v6.sel[tb];if(!all.includes(k))k=S.v6.sel[tb]=H.hk?H.hk.k:all[0];return k}

const CHEV='<svg class="chev" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M3.5 1.8 L7 5 L3.5 8.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const ssr5=(i,ks)=>{const c={E:0,H:0};ks.forEach(K=>{if(K.p===null)return;const m=mast(i,K.k);if(m&&c[m.cat]!==undefined)c[m.cat]++});const t=[c.E?c.E+' not yet':'',c.H?c.H+' developing':''].filter(Boolean).join(', ');return t?`<span class="sr">${NM[i]}: ${t}</span>`:''};

function v6list(tb){const H=hard5(tb),T=H.T,ids=tbWho(tb),Tb=TB[tb],E=ex5(tb,H),k0=sel5(tb,H),hard=S.v6.sort!=='course',sel=S.stu,fol=sel!==null&&ids.includes(sel);

/* ---------- skills across all textbooks ---------- */
const xRows=()=>ASK.map((_,k)=>k).filter(k=>k<NK||k>=NSK).map(k=>({k,wk:k<NSK?k+1:XTW[k],o:tbOfSub(k)})).sort((a,b)=>a.wk-b.wk||a.k-b.k);

/* ---------- view 7: misconception lifelines ---------- */
function h7(){const p=MC.filter(m=>SG[m.st]==='p').length,g=MC.filter(m=>SG[m.st]==='g').length;
  return `${p} misconceptions are still a problem; ${g} are gone.`}
function v7(){const sel=S.stu,f=S.v7.f;

  const W=760,L=262,R=92,T0=44,rh=32,H=T0+rows.length*rh+28,st=(W-L-R)/NWK,x=w=>L+(w+.5)*st,th=v=>Math.max(2,v/50*(rh-8)),xt=L+NOW*st;
  let s=`<svg class="viz" viewBox="0 0 ${W} ${H}" role="group" aria-label="Lifelines of misconceptions across ${NWK} weeks; thickness shows the share of the class holding each one"><defs>${HATCH}</defs>`;
  TB0.forEach((U,u)=>{const a=L+(U.wk[0]-1)*st,uw=(U.wk[1]-U.wk[0]+1)*st;if(u%2)s+=`<rect x="${f1(a)}" y="${T0-22}" width="${f1(uw)}" height="${rows.length*rh+22}" style="fill:var(--band)"/>`;s+=T(a+uw/2,T0-9,U.s,{a:'middle',c:U.wk[0]>NOW?'t3':'t2'})});
  if(NWK>NOW)s+=`<rect x="${f1(xt)}" y="${T0-4}" width="${f1((NWK-NOW)*st)}" height="${rows.length*rh+4}" fill="url(#hatch)" opacity=".55"/>`;
  s+=`<line x1="${f1(xt)}" x2="${f1(xt)}" y1="${T0-30}" y2="${T0+rows.length*rh}" style="stroke:var(--accent);stroke-width:2"/>`+T(xt,T0-33,'Today',{a:'middle',c:'tacc',w:700});
  rows.forEach((o,ri)=>{const m=o.m,yc=T0+ri*rh+rh/2,g=SG[m.st],col=SC[g][0],holds=sel!==null&&m.now.includes(NM[sel]),held=sel!==null&&m.peak.includes(NM[sel]),dim=sel!==null&&!holds&&!held;
    s+=`<g class="row${S.v7.r===o.i?' on':''}${dim?' dim':''}" data-act="v7row" data-r="${o.i}" tabindex="0" role="button" aria-label="${esc(m.n)}, ${m.st}: show details"><rect class="rbg" x="2" y="${f1(yc-rh/2+1)}" width="${W-4}" height="${rh-2}" rx="6"/>`;
    s+=T(L-12,yc+4,esc(m.n),{a:'end',c:holds?'tacc':'t1',w:holds?700:null});
    if(holds)s+=`<circle cx="14" cy="${f1(yc)}" r="4.5" style="fill:var(--accent)"/>`;else if(held)s+=`<circle cx="14" cy="${f1(yc)}" r="4" style="fill:none;stroke:var(--accent);stroke-width:1.6"/>`;

      s+=`<polygon points="${pts}" style="fill:${col}"/>`;if(e===NOW-1)s+=`<path d="M${f1(xt+3)} ${f1(yc-6)} L${f1(xt+11)} ${f1(yc)} L${f1(xt+3)} ${f1(yc+6)} Z" style="fill:${col}"/>`;w=e+1}else w++}
    m.rt.forEach(rw=>{const xx=x(rw-1);s+=`<path d="M${f1(xx)} ${f1(yc-7)} L${f1(xx+6)} ${f1(yc)} L${f1(xx)} ${f1(yc+7)} L${f1(xx-6)} ${f1(yc)} Z" style="fill:var(--good);stroke:var(--surface);stroke-width:1.5"/>`});
    s+=T(W-R+10,yc+4,m.st,{c:SC[g][1],w:700});
    for(let k=0;k<NOW;k++){const v=m.v[k];s+=`<rect x="${f1(L+k*st)}" y="${f1(yc-rh/2+1)}" width="${f1(st)}" height="${rh-2}" fill="transparent"${tp(`<b>${esc(m.n)}</b><br>Week ${k+1}: ${v>=5?`${v}% of the class`:'not seen'}${m.rt.includes(k+1)?'<br>Retaught this week':''}`)}/>`}
    s+='</g>'});
  if(!rows.length)s+=T(W/2,T0+20,'No misconceptions match this filter.',{a:'middle',c:'t3'});
  [0,7,12,19].forEach(k=>{s+=T(x(k),H-6,k===0?'Week 1':k+1,{a:'middle',c:'t3'})});

    det=`<div class="detail"><div class="dhead"><h3>${esc(m.n)}</h3><span class="pill ${SC[g][3]}">${m.st}</span><span class="dnext">${esc(m.nx)}</span>${g==='p'?(isLogged('v7:'+i)?'<span class="pill good">Lesson planned</span>':`<button class="btn small primary" type="button" data-act="v7plan" data-r="${i}">Plan a root lesson</button>`):''}</div>
    <p class="dtext">${esc(m.ex)}</p>${m.now.length?whoCol('Holds it now',SC[g][0],m.now):''}</div>`}
  return ctl+leg+fig(s)+det}

/* ---------- view 8 (Q7): stall points, rolled up from content to subunits and units ----------
   Same outline as Q5: units open into subunits, subunits into their content in the order students meet it.
   Each bar splits the students who use the textbook: gave up, skipped, needed retries, and the rest got it first time.
   A unit or subunit pools all of its content. */
const pathMark=(cx,y,o)=>o===0?`<circle cx="${f1(cx)}" cy="${y}" r="6" style="fill:var(--accent)"/>`:o===1?`<circle cx="${f1(cx)}" cy="${y}" r="5.2" style="fill:var(--surface);stroke:var(--accent);stroke-width:2"/><path d="M${f1(cx)} ${y-5.2} A5.2 5.2 0 0 0 ${f1(cx)} ${y+5.2} Z" style="fill:var(--accent)"/>`:o===2?`<path d="M${f1(cx-5)} ${y-5} L${f1(cx+5)} ${y+5} M${f1(cx+5)} ${y-5} L${f1(cx-5)} ${y+5}" style="stroke:var(--accent);stroke-width:2.4;stroke-linecap:round"/>`:`<circle cx="${f1(cx)}" cy="${y}" r="5.2" style="fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:2.5 2"/>`;
const pm7=o=>`<svg class="pm" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">${pathMark(7,7,o)}</svg>`;
const OUT7=['First time','Needed retries','Gave up','Skipped'];
const pool7=cs=>{const t=[0,0,0,0];let n=0;cs.forEach(x=>{x.t.forEach((v,q)=>t[q]+=v);n+=x.n});return {t,n}};
function tree7(tb){
  return TB[tb].units.map((U,u)=>{const subs=[2*u,2*u+1].map(j=>{const J=TBJ(tb,j),on=J.wk[0]<=NOW,ct=ctOf(tb,j);
      const cs=on?cCnt(tb,j).map((c,s)=>({s,j,nm:ct[s][0],kind:ct[s][1],t:c,n:c[0]+c[1]+c[2]+c[3]})):[];
      return Object.assign({j,J,on,cs},pool7(cs))});
    return Object.assign({u,U,on:tU(tb,u),subs},pool7(subs.flatMap(x=>x.cs)))})}
/* where the most students gave up, and where the most skipped */
function worst7(T){let g=null,k=null;T.forEach(U=>U.subs.forEach(J=>J.cs.forEach(C=>{if(!g||C.t[2]>g.t[2])g=Object.assign({u:U.u},C);if(!k||C.t[3]>k.t[3])k=Object.assign({u:U.u},C)})));return {g,k}}
function h8(){const tb=S.v8.tb,Tb=TB[tb],{g,k}=worst7(tree7(tb)),n=tbWho(tb).length,of=v=>n<NM.length?`${v} of ${n}`:v,JN=j=>TBJ(tb,j).n;
  if(!g)return `Nothing in ${Tb.n} has started yet.`;
  if(g.t[2]<2&&k.t[3]<3)return `Nobody is stalling in ${Tb.n} so far.`;
  if(g.j===k.j)return `In ${JN(g.j)}, ${of(k.t[3])} students skipped ${k.nm} and ${g.t[2]} gave up at ${g.nm}.`;
  return `Most give up at ${g.nm} in ${JN(g.j)} (${of(g.t[2])} students); most skip ${k.nm} in ${JN(k.j)} (${of(k.t[3])}).`}
/* which rows are open: by default the subunit where the most gave up */
function ex7(tb,T){if(!S.v8.ex[tb]){const {g,k}=worst7(T),U=[],J=[];if(g){U.push(g.u);J.push(g.j);if(k&&k.u===g.u&&k.j!==g.j)J.push(k.j)}S.v8.ex[tb]={U,J}}return S.v8.ex[tb]}
function sel7(tb,T){const all=T.flatMap(U=>U.subs.flatMap(J=>J.cs));let s=S.v8.sel[tb];if(!s||!all.some(C=>C.j===s.j&&C.s===s.s)){const {g}=worst7(T);s=S.v8.sel[tb]=g?{j:g.j,s:g.s}:{j:all[0].j,s:0}}return s}
function open7(tb,j,s){const E=ex7(tb,tree7(tb)),u=j>>1;if(!E.U.includes(u))E.U.push(u);if(!E.J.includes(j))E.J.push(j);S.v8.sel[tb]={j,s};S.v8.tb=tb}

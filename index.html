<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insight Lens · mock</title>
  <!-- Roboto, the typeface of Material UI. Without a connection the page falls back to Helvetica or Arial. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/atlas.css?v=24">
</head>
<body>
  <header class="topbar">
    <div class="logo">A</div><span class="brand">ALPS</span><span class="product">Insight Lens</span>
    <span class="classname" id="cname"></span>
    <div class="spacer"></div>
    <span class="demo-date">Mock · real class data</span>
    <button id="logchip" class="logchip" type="button" data-act="log">Action log <b id="logn">0</b></button>
    <div class="avatar">MA</div>
  </header>
  <div class="shell">
    <nav id="rail" class="rail" aria-label="Views"></nav>
    <div class="page">
      <div id="thread" class="thread" role="region" aria-label="Followed student" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
      <p class="foot" id="foot">Anonymised class data. Nothing here is saved.</p>
      <details class="data"><summary>Where the numbers come from</summary><div id="src"></div></details>
    </div>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="data/class.js?v=24"></script>
  <script src="data/sample.js?v=24"></script>
  <script src="js/atlas.js?v=24"></script>
</body>
</html>
